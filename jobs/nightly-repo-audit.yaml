id: nightly-repo-audit
name: Nightly repo audit
description: Reviews the last day of commits and writes a short risk report.
enabled: false
trigger:
  type: cron
  cron: "0 2 * * *"
  timezone: Asia/Shanghai
agent:
  type: pi
  # 不要写宿主绝对路径：这个示例在 QA 容器里也要能跑，那里源码在 /app。
  # 改成你自己的仓库路径后再把 enabled 打开。
  cwd: /tmp
  tools: [read, grep, find, ls, bash]
  appendSystemPrompt: |
    You are running unattended inside aaas. Keep the final answer under
    20 lines and prefer reading files over running commands.
prompt: |
  Look at the commits from the last 24 hours (git log --since="24 hours ago").
  Summarise: what changed, what looks risky, and what deserves a follow-up.
  Write the summary to reports/audit.md and reply with the same text.
timeoutMs: 900000
retries: 1
retryBackoffMs: 60000
tags: [audit, nightly]
